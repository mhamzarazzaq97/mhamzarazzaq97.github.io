  <style>
    :root {
      --bg-dark: #090d16;
      --bg-surface: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --accent-hover: #0ea5e9;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      --shadow-lg: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      --radius: 12px;
      --header-h: 70px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: fixed;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 400px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(99, 102, 241, 0.08) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Sticky Navigation Header */
    header {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: var(--header-h);
      background: rgba(9, 13, 22, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      transition: all 0.3s ease;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      color: #090d16;
      box-shadow: 0 0 20px var(--accent-glow);
      flex-shrink: 0;
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-kubestronaut {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(99, 102, 241, 0.2));
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #7dd3fc;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .badge-kubestronaut svg {
      color: #38bdf8;
    }

    /* Actions Suite */
    .actions-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      border: 1px solid var(--border);
      background: rgba(30, 41, 59, 0.6);
      color: var(--text-main);
      outline: none;
    }

    .btn:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: var(--border-hover);
      color: #fff;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-icon-only {
      padding: 8px;
      border-radius: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #090d16;
      font-weight: 700;
      border: 1px solid transparent;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #7dd3fc, #38bdf8);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
      color: #090d16;
      transform: translateY(-1px);
    }

    /* PDF Viewer Container */
    main {
      width: 100%;
      max-width: 900px;
      padding: 28px 16px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      z-index: 1;
    }

    #pdf-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      transition: transform 0.2s ease-out;
      transform-origin: top center;
    }

    .pdf-page-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255, 255, 255, 0.08);
      transition: box-shadow 0.3s ease;
    }

    .pdf-page-wrapper:hover {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(56, 189, 248, 0.2);
    }

    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      max-width: 860px;
    }

    /* Skeleton Loading State */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 860px;
      min-height: 500px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      position: relative;
      overflow: hidden;
    }

    #loading::after {
      content: "";
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      background-image: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0,
        rgba(255, 255, 255, 0.04) 20%,
        rgba(255, 255, 255, 0.08) 60%,
        rgba(255, 255, 255, 0)
      );
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Floating Controller Bar */
    .floating-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-hover);
      padding: 6px 12px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 90;
      transition: all 0.3s ease;
    }

    .floating-bar:hover {
      border-color: rgba(56, 189, 248, 0.4);
    }

    .bar-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
    }

    .page-indicator {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 75px;
      text-align: center;
    }

    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .zoom-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .zoom-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-subtle);
      min-width: 42px;
      text-align: center;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      top: 85px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Footer */
    footer {
      width: 100%;
      padding: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-subtle);
      margin-top: auto;
      z-index: 1;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 6px;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--accent);
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 768px) {
      :root {
        --header-h: 64px;
      }
      header {
        padding: 0 14px;
      }
      .brand-title {
        font-size: 0.95rem;
      }
      .brand-subtitle {
        display: none;
      }
      .btn span {
        display: none;
      }
      .btn-primary span {
        display: inline;
      }
      .btn {
        padding: 8px 10px;
      }
      main {
        padding: 16px 8px 90px;
        gap: 16px;
      }
      #pdf-container {
        gap: 16px;
      }
      .floating-bar {
        bottom: 16px;
        padding: 5px 10px;
        gap: 8px;
      }
    }
  </style>
</head>

        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

  </header>

  <!-- Main Viewer Content -->
  <main>
    <div id="loading">
      <div class="spinner"></div>
      <p style="font-weight: 600; font-size: 0.95rem;">Rendering Resume...</p>
      <span style="font-size: 0.8rem; color: var(--text-subtle);">Optimizing high-resolution preview</span>

  </main>

  <!-- Floating Controller Bar -->

    <button class="zoom-btn" id="zoom-out" title="Zoom out" aria-label="Zoom out">

      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
    </button>

  <!-- Toast Notification -->
  <div id="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="toast-message">Email copied to clipboard!</span>
  </div>

  <!-- Footer -->

    <span>&copy; <span id="year"></span> Muhammad Hamza Razzaq &bull; Hosted on</span>
    <a href="https://github.com/mhamzarazzaq97/mhamzarazzaq97.github.io" target="_blank" rel="noopener noreferrer">GitHub Pages</a>
  </footer>

  <script>
    const pdfUrl = './Hamza_Razzaq_DevOps.pdf';
    document.getElementById('year').textContent = new Date().getFullYear();

    // PDF.js worker configuration
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let currentZoom = 1.0;
    const container = document.getElementById('pdf-container');
    const loadingEl = document.getElementById('loading');
    const floatingBar = document.getElementById('floating-bar');
    const zoomLabel = document.getElementById('zoom-label');
    const pageIndicator = document.getElementById('page-indicator');
    let totalPages = 2;

    // Toast Alert Helper
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Email Copy Action
    document.getElementById('copy-email-btn').addEventListener('click', async () => {
      const email = 'mhamzarazzaq97@gmail.com';
      try {
        await navigator.clipboard.writeText(email);
        showToast('Email copied to clipboard!');
      } catch (err) {
        window.location.href = `mailto:${email}`;
      }
    });

    // Print Action
    document.getElementById('print-btn').addEventListener('click', () => {
      window.print();
    });

    // Zoom Controls
    function updateZoom(newZoom) {
      currentZoom = Math.min(Math.max(newZoom, 0.7), 1.6);
      zoomLabel.textContent = `${Math.round(currentZoom * 100)}%`;
      container.style.transform = `scale(${currentZoom})`;
    }

    document.getElementById('zoom-in').addEventListener('click', () => updateZoom(currentZoom + 0.1));
    document.getElementById('zoom-out').addEventListener('click', () => updateZoom(currentZoom - 0.1));

    // Render PDF Pages
    pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
      totalPages = pdf.numPages;
      if (loadingEl) loadingEl.style.display = 'none';
      floatingBar.style.display = 'flex';
      pageIndicator.textContent = `Page 1 of ${totalPages}`;

      for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        
        // High-DPI Retina Rendering calculation
        const pixelRatio = Math.max(window.devicePixelRatio || 1, 2);
        const scale = pixelRatio * 1.5;
        const viewport = page.getViewport({ scale: scale });

        const pageWrapper = document.createElement('div');
        pageWrapper.className = 'pdf-page-wrapper';
        pageWrapper.setAttribute('data-page-num', pageNum);

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d', { alpha: false });
        
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        
        pageWrapper.appendChild(canvas);
        container.appendChild(pageWrapper);

        const renderContext = {
          canvasContext: context,
          viewport: viewport
        };

        await page.render(renderContext).promise;
      }

      // Scroll Spy to track current page
      const pageElements = document.querySelectorAll('.pdf-page-wrapper');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const num = entry.target.getAttribute('data-page-num');
            pageIndicator.textContent = `Page ${num} of ${totalPages}`;
          }
        });
      }, { threshold: 0.5 });

      pageElements.forEach(el => observer.observe(el));

    }).catch((err) => {
      console.error('Error rendering PDF:', err);
      if (loadingEl) {
        loadingEl.innerHTML = `
          <p style="color: #ef4444; font-weight: 600;">Unable to preview PDF directly in browser.</p>
          <a href="${pdfUrl}" class="btn btn-primary" style="margin-top: 12px;">Download PDF Directly</a>
        `;
      }
    });
  </script>
