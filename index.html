  <style>
    :root {
      --bg-dark: #090d16;
      --bg-surface: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --accent-hover: #0ea5e9;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      --shadow-lg: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      --radius: 12px;
      --header-h: 70px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: fixed;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 400px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(99, 102, 241, 0.08) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Sticky Navigation Header */
    header {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: var(--header-h);
      background: rgba(9, 13, 22, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      transition: all 0.3s ease;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      color: #090d16;
      box-shadow: 0 0 20px var(--accent-glow);
      flex-shrink: 0;
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badges {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 9999px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .badge-role {
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
    }

    .badge-k8s {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(99, 102, 241, 0.15));
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .badge-aws {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
    }

    .badge-tf {
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.35);
      color: #c084fc;
    }

    /* Actions Suite */
    .actions-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      border: 1px solid var(--border);
      background: rgba(30, 41, 59, 0.6);
      color: var(--text-main);
      outline: none;
    }

    .btn:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: var(--border-hover);
      color: #fff;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-icon-only {
      padding: 8px;
      border-radius: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #090d16;
      font-weight: 700;
      border: 1px solid transparent;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #7dd3fc, #38bdf8);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
      color: #090d16;
      transform: translateY(-1px);
    }

    /* PDF Viewer Container */
    main {
      width: 100%;
      max-width: 900px;
      padding: 28px 16px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      z-index: 1;
    }

    #pdf-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      transition: transform 0.2s ease-out;
      transform-origin: top center;
    }

    .pdf-page-wrapper {
      position: relative;
      width: 100%;
      max-width: 860px;
      display: flex;
      justify-content: center;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255, 255, 255, 0.08);
      transition: box-shadow 0.3s ease;
      user-select: text;
      -webkit-user-select: text;
    }

    .pdf-page-wrapper:hover {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(56, 189, 248, 0.2);
    }

    .textLayer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      opacity: 1;
      line-height: 1.0;
      transform-origin: 0 0;
      z-index: 2;
      user-select: text;
      -webkit-user-select: text;
    }

    .textLayer span,
    .textLayer br {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    .textLayer ::selection {
      background: rgba(56, 189, 248, 0.35);
      color: transparent;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      max-width: 860px;
      z-index: 1;
    }

    /* Skeleton Loading State */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 860px;
      min-height: 500px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      position: relative;
      overflow: hidden;
    }

    #loading::after {
      content: "";
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      background-image: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0,
        rgba(255, 255, 255, 0.04) 20%,
        rgba(255, 255, 255, 0.08) 60%,
        rgba(255, 255, 255, 0)
      );
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Floating Controller Bar */
    .floating-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-hover);
      padding: 6px 12px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 90;
      transition: all 0.3s ease;
    }

    .floating-bar:hover {
      border-color: rgba(56, 189, 248, 0.4);
    }

    .bar-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
    }

    .page-indicator {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 75px;
      text-align: center;
    }

    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .zoom-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .zoom-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-subtle);
      min-width: 42px;
      text-align: center;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      top: 85px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Footer */
    footer {
      width: 100%;
      padding: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-subtle);
      margin-top: auto;
      z-index: 1;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 6px;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--accent);
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 768px) {
      header {
        padding: 10px 14px;
      }
      .brand-title {
        font-size: 0.95rem;
      }
      .brand-badges {
        gap: 4px;
      }
      .badge-pill {
        font-size: 0.64rem;
        padding: 2px 6px;
      }
      .badge-pill svg {
        width: 9px;
        height: 9px;
      }
      .btn {
        padding: 6px 10px;
        font-size: 0.78rem;
      }
      main {
        padding: 16px 8px 90px;
        gap: 16px;
      }
      #pdf-container {
        gap: 16px;
      }
      .floating-bar {
        bottom: 16px;
        padding: 5px 10px;
        gap: 8px;
      }
    }
  </style>
</head>

  <script>
    const pdfUrl = './Hamza_Razzaq_DevOps.pdf';
    document.getElementById('year').textContent = new Date().getFullYear();

    // PDF.js worker configuration
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let currentZoom = 1.0;
    const container = document.getElementById('pdf-container');
    const loadingEl = document.getElementById('loading');
    const floatingBar = document.getElementById('floating-bar');
    const zoomLabel = document.getElementById('zoom-label');
    const pageIndicator = document.getElementById('page-indicator');
    let totalPages = 2;

    // Toast Alert Helper
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Email Copy Action (if button exists)
    const copyBtn = document.getElementById('copy-email-btn');
    if (copyBtn) {
      copyBtn.addEventListener('click', async () => {
        const email = 'mhamzarazzaq97@gmail.com';
        try {
          await navigator.clipboard.writeText(email);
          showToast('Email copied to clipboard!');
        } catch (err) {
          window.location.href = `mailto:${email}`;
        }
      });
    }

    // Print Action
    document.getElementById('print-btn').addEventListener('click', () => {
      window.print();
    });

    // Zoom Controls
    function updateZoom(newZoom) {
      currentZoom = Math.min(Math.max(newZoom, 0.7), 1.6);
      zoomLabel.textContent = `${Math.round(currentZoom * 100)}%`;
      container.style.transform = `scale(${currentZoom})`;
    }

    document.getElementById('zoom-in').addEventListener('click', () => updateZoom(currentZoom + 0.1));
    document.getElementById('zoom-out').addEventListener('click', () => updateZoom(currentZoom - 0.1));

    // Render PDF Pages
    pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
      totalPages = pdf.numPages;
      if (loadingEl) loadingEl.style.display = 'none';
      floatingBar.style.display = 'flex';
      pageIndicator.textContent = `Page 1 of ${totalPages}`;

      for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        
        // High-DPI Retina Rendering calculation
        const pixelRatio = Math.max(window.devicePixelRatio || 1, 2);
        const cssScale = 1.45;
        const cssViewport = page.getViewport({ scale: cssScale });
        const canvasViewport = page.getViewport({ scale: cssScale * pixelRatio });

        const pageWrapper = document.createElement('div');
        pageWrapper.className = 'pdf-page-wrapper';
        pageWrapper.setAttribute('data-page-num', pageNum);
        pageWrapper.style.maxWidth = `${cssViewport.width}px`;

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d', { alpha: false });
        
        canvas.width = canvasViewport.width;
        canvas.height = canvasViewport.height;
        
        pageWrapper.appendChild(canvas);

        // Text Layer for text selection and copy-pasting
        const textLayerDiv = document.createElement('div');
        textLayerDiv.className = 'textLayer';
        textLayerDiv.style.setProperty('--scale-factor', cssScale);
        pageWrapper.appendChild(textLayerDiv);

        container.appendChild(pageWrapper);

        // Render Canvas
        await page.render({
          canvasContext: context,
          viewport: canvasViewport
        }).promise;

        // Render TextLayer
        const textContent = await page.getTextContent();
        await pdfjsLib.renderTextLayer({
          textContentSource: textContent,
          container: textLayerDiv,
          viewport: cssViewport,
          textDivs: []
        }).promise;
      }

      // Scroll Spy to track current page
      const pageElements = document.querySelectorAll('.pdf-page-wrapper');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const num = entry.target.getAttribute('data-page-num');
            pageIndicator.textContent = `Page ${num} of ${totalPages}`;
          }
        });
      }, { threshold: 0.5 });

      pageElements.forEach(el => observer.observe(el));

    }).catch((err) => {
      console.error('Error rendering PDF:', err);
      if (loadingEl) {
        loadingEl.innerHTML = `
          <p style="color: #ef4444; font-weight: 600;">Unable to preview PDF directly in browser.</p>
          <a href="${pdfUrl}" class="btn btn-primary" style="margin-top: 12px;">Download PDF Directly</a>
        `;
      }
    });
  </script>

</body>
</html>
