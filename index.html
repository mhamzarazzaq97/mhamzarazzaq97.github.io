<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Muhammad Hamza Razzaq — DevOps Engineer | Kubestronaut</title>
  
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="DevOps Engineer with 7+ years of experience. Kubestronaut, 4x AWS Certified, Terraform Certified. Expert in EKS, RDS, Terraform, GitOps, and Cloud Architecture.">
  <meta name="author" content="Muhammad Hamza Razzaq">
  <meta property="og:title" content="Muhammad Hamza Razzaq — DevOps Engineer | Kubestronaut">
  <meta property="og:description" content="DevOps Engineer | Kubestronaut | 4x AWS Certified | Terraform Certified">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.hamzarazzaq.com">

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation Header */
    header {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .brand p {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #0f172a;
      border: 1px solid transparent;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: #334155;
      border-color: #475569;
      transform: translateY(-1px);
    }

    /* PDF Viewer Container */
    main {
      width: 100%;
      max-width: 900px;
      padding: 24px 16px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #pdf-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .pdf-page-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      max-width: 860px;
    }

    /* Loading Spinner */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 60px 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile Responsiveness */
    @media (max-width: 640px) {
      header {
        padding: 10px 14px;
      }
      .brand h1 {
        font-size: 0.95rem;
      }
      .brand p {
        display: none;
      }
      .btn {
        padding: 6px 10px;
        font-size: 0.78rem;
      }
      main {
        padding: 12px 8px 36px;
        gap: 12px;
      }
      #pdf-container {
        gap: 12px;
      }
      .pdf-page-wrapper {
        border-radius: 4px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Muhammad Hamza Razzaq</h1>
      <p><span class="badge">Kubestronaut</span> DevOps Engineer &bull; 4x AWS &bull; Terraform</p>
    </div>
    <div class="actions">
      <a href="https://linkedin.com/in/hamzarazzaq97" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.2V10.9H6.46M7.83 6.45a1.6 1.6 0 0 0-1.6 1.6 1.6 1.6 0 0 0 1.6 1.6 1.6 1.6 0 0 0 1.6-1.6 1.6 1.6 0 0 0-1.6-1.6Z"/></svg>
        LinkedIn
      </a>
      <a href="./Hamza_Razzaq_DevOps.pdf" download="Hamza_Razzaq_DevOps.pdf" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download PDF
      </a>
    </div>
  </header>

  <main>
    <div id="loading">
      <div class="spinner"></div>
      <span>Loading CV...</span>
    </div>
    <div id="pdf-container"></div>
  </main>

  <script>
    const pdfUrl = './Hamza_Razzaq_DevOps.pdf';

    // Set PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Load and render PDF
    pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
      const loadingEl = document.getElementById('loading');
      if (loadingEl) loadingEl.style.display = 'none';

      const container = document.getElementById('pdf-container');

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        
        // High-DPI rendering for sharp text on Retina / iPhone screens
        const pixelRatio = Math.max(window.devicePixelRatio || 1, 2);
        const unscaledViewport = page.getViewport({ scale: 1.0 });
        const scale = pixelRatio * 1.5;
        const viewport = page.getViewport({ scale: scale });

        const pageWrapper = document.createElement('div');
        pageWrapper.className = 'pdf-page-wrapper';

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d', { alpha: false });
        
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        
        pageWrapper.appendChild(canvas);
        container.appendChild(pageWrapper);

        const renderContext = {
          canvasContext: context,
          viewport: viewport
        };

        await page.render(renderContext).promise;
      }
    }).catch((err) => {
      console.error('Error rendering PDF:', err);
      const loadingEl = document.getElementById('loading');
      if (loadingEl) {
        loadingEl.innerHTML = `
          <p style="color: #ef4444; font-weight: 600;">Unable to render preview inline.</p>
          <a href="${pdfUrl}" class="btn btn-primary" style="margin-top: 12px;">Download / Open PDF Directly</a>
        `;
      }
    });
  </script>

</body>
</html>
